<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site_name }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="dark">
    <header class="topbar">
        <div class="topbar-left">
            <svg class="logo-icon" id="logoIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="cursor:pointer"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 4L12 13 2 4"/></svg>
            <span class="site-title" id="siteTitle">{{ site_name }}</span>
        </div>
    </header>

    <!-- Hidden Admin Login Modal -->
    <div id="adminModal" class="admin-modal hidden">
        <div class="admin-modal-backdrop" onclick="closeAdminModal()"></div>
        <div class="admin-modal-card">
            <button class="admin-modal-close" onclick="closeAdminModal()">&times;</button>
            <h2>Admin Login</h2>
            <div id="adminError" class="error-msg" style="display:none"></div>
            <form id="adminLoginForm" onsubmit="return handleAdminLogin(event)">
                <input type="text" id="adminUser" placeholder="Username" required autocomplete="off">
                <input type="password" id="adminPass" placeholder="Password" required>
                <button type="submit" class="btn-primary btn-full">Login</button>
            </form>
        </div>
    </div>

    <!-- Mode Tabs + Entry Section -->
    <div id="tokenSection" class="token-section">
        <div class="token-card">
            <div class="mode-tabs">
                <button class="mode-tab active" data-mode="token" onclick="switchMode('token')">Token</button>
                <button class="mode-tab" data-mode="totp" onclick="switchMode('totp')">2FA Authenticator</button>
            </div>

            <!-- Token Mode -->
            <div id="modeToken" class="mode-content active">
                <h2>Enter Your Token</h2>
                <p class="token-desc">Paste your access token to view incoming emails</p>
                <div class="token-input-row">
                    <input type="text" id="tokenInput" placeholder="Paste token here..." autocomplete="off">
                    <button id="submitToken" class="btn-primary" onclick="submitToken()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>

            <!-- 2FA Authenticator Mode -->
            <div id="modeTotp" class="mode-content">
                <h2>2FA Authenticator</h2>
                <p class="token-desc">Enter your TOTP secret to generate 2FA codes</p>
                <div class="token-input-row">
                    <input type="text" id="totpSecretInput" placeholder="Base32 secret (e.g. JBSWY3DPEHPK3PXP)" autocomplete="off">
                    <button class="btn-primary" onclick="startTotp()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M12 6v6l4 2"/></svg>
                    </button>
                </div>
                <!-- TOTP Display -->
                <div id="totpDisplay" class="totp-display hidden">
                    <div class="totp-code-wrapper">
                        <div class="totp-code" id="totpCode">------</div>
                        <button class="btn-icon totp-copy" onclick="copyTotpCode()" title="Copy code">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                        </button>
                    </div>
                    <div class="totp-timer-wrapper">
                        <svg class="totp-ring" width="48" height="48" viewBox="0 0 48 48">
                            <circle class="totp-ring-bg" cx="24" cy="24" r="20" fill="none" stroke-width="4"/>
                            <circle class="totp-ring-fg" id="totpRing" cx="24" cy="24" r="20" fill="none" stroke-width="4" stroke-dasharray="125.66" stroke-dashoffset="0" transform="rotate(-90 24 24)"/>
                        </svg>
                        <span class="totp-seconds" id="totpSeconds">30</span>
                    </div>
                    <button class="btn-totp-stop" onclick="stopTotp()">Stop</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Gmail-like Email View -->
    <div id="emailSection" class="email-section hidden">
        <div class="email-toolbar">
            <div class="email-toolbar-left">
                <button class="btn-icon" onclick="goBack()" title="Back">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </button>
                <span class="email-address" id="emailAddress"></span>
            </div>
            <div class="email-toolbar-right">
                <button id="scanBtn" class="btn-scan" onclick="startScan()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                    <span id="scanBtnText">Scan Email</span>
                </button>
            </div>
        </div>

        <div class="gmail-layout">
            <!-- Email List -->
            <div class="email-list" id="emailList">
                <div class="empty-state" id="emptyState">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 4L12 13 2 4"/></svg>
                    <p>No emails yet</p>
                    <p class="empty-sub">Click "Scan Email" to check for new messages</p>
                </div>
            </div>

            <!-- Email Detail -->
            <div class="email-detail" id="emailDetail">
                <div class="detail-placeholder">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="64" height="64"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 4L12 13 2 4"/></svg>
                    <p>Select an email to read</p>
                </div>
            </div>
        </div>

        <!-- Scan notification bar -->
        <div id="scanNotification" class="scan-notification hidden">
            <span id="scanNotifText"></span>
            <button class="btn-notif-scan" onclick="startScan()">Scan Again</button>
        </div>
    </div>

    <script>
        let currentToken = '';
        let allEmails = [];
        let scanTimer = null;
        let scanCountdown = 30;
        let totpInterval = null;
        let totpSecret = null;

        // ─── Mode Switching ─────────────────────────────────────
        function switchMode(mode) {
            document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
            document.getElementById('modeToken').classList.toggle('active', mode === 'token');
            document.getElementById('modeTotp').classList.toggle('active', mode === 'totp');
        }

        // ─── TOTP (2FA Authenticator) ────────────────────────────
        function base32Decode(input) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
            input = input.replace(/[\s=-]+/g, '').toUpperCase();
            let bits = '';
            for (const c of input) {
                const val = chars.indexOf(c);
                if (val === -1) continue;
                bits += val.toString(2).padStart(5, '0');
            }
            const bytes = new Uint8Array(Math.floor(bits.length / 8));
            for (let i = 0; i < bytes.length; i++) {
                bytes[i] = parseInt(bits.slice(i * 8, i * 8 + 8), 2);
            }
            return bytes;
        }

        async function hmacSha1(keyBytes, message) {
            const key = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
            const sig = await crypto.subtle.sign('HMAC', key, message);
            return new Uint8Array(sig);
        }

        async function generateTOTP(secretBytes, period = 30, digits = 6) {
            const epoch = Math.floor(Date.now() / 1000);
            const counter = Math.floor(epoch / period);
            const counterBytes = new Uint8Array(8);
            let tmp = counter;
            for (let i = 7; i >= 0; i--) {
                counterBytes[i] = tmp & 0xff;
                tmp = Math.floor(tmp / 256);
            }
            const hash = await hmacSha1(secretBytes, counterBytes.buffer);
            const offset = hash[hash.length - 1] & 0x0f;
            const binary = ((hash[offset] & 0x7f) << 24) | (hash[offset + 1] << 16) | (hash[offset + 2] << 8) | hash[offset + 3];
            const otp = binary % Math.pow(10, digits);
            return otp.toString().padStart(digits, '0');
        }

        async function startTotp() {
            const raw = document.getElementById('totpSecretInput').value.trim();
            if (!raw) return;
            try {
                totpSecret = base32Decode(raw);
                if (totpSecret.length === 0) throw new Error('empty');
            } catch (e) {
                alert('Invalid Base32 secret');
                return;
            }
            document.getElementById('totpDisplay').classList.remove('hidden');
            await updateTotpCode();
            if (totpInterval) clearInterval(totpInterval);
            totpInterval = setInterval(updateTotpCode, 1000);
        }

        async function updateTotpCode() {
            if (!totpSecret) return;
            const code = await generateTOTP(totpSecret);
            document.getElementById('totpCode').textContent = code.slice(0, 3) + ' ' + code.slice(3);
            const epoch = Math.floor(Date.now() / 1000);
            const remaining = 30 - (epoch % 30);
            document.getElementById('totpSeconds').textContent = remaining;
            const circumference = 2 * Math.PI * 20; // r=20
            const offset = circumference * (1 - remaining / 30);
            document.getElementById('totpRing').setAttribute('stroke-dashoffset', offset);
        }

        function stopTotp() {
            if (totpInterval) { clearInterval(totpInterval); totpInterval = null; }
            totpSecret = null;
            document.getElementById('totpDisplay').classList.add('hidden');
            document.getElementById('totpCode').textContent = '------';
        }

        function copyTotpCode() {
            const code = document.getElementById('totpCode').textContent.replace(/\s/g, '');
            navigator.clipboard.writeText(code).then(() => {
                const btn = document.querySelector('.totp-copy');
                btn.style.color = 'var(--success)';
                setTimeout(() => { btn.style.color = ''; }, 1500);
            });
        }

        // ─── Check URL for auto-scan ────────────────────────────
        (function() {
            const params = new URLSearchParams(window.location.search);
            const t = params.get('token');
            if (t) {
                document.getElementById('tokenInput').value = t;
                submitToken();
            }
        })();

        async function submitToken() {
            const token = document.getElementById('tokenInput').value.trim();
            if (!token) return;
            currentToken = token;

            document.getElementById('tokenSection').classList.add('hidden');
            document.getElementById('emailSection').classList.remove('hidden');

            // Immediate scan
            const formData = new FormData();
            formData.append('token', token);

            try {
                const resp = await fetch('/api/scan', { method: 'POST', body: formData });
                if (!resp.ok) {
                    const err = await resp.json();
                    alert(err.detail || 'Invalid token');
                    goBack();
                    return;
                }
                const data = await resp.json();
                document.getElementById('emailAddress').textContent = data.email;
                mergeEmails(data.emails);
                renderEmailList();
            } catch (e) {
                alert('Error connecting to server');
                goBack();
            }
        }

        function mergeEmails(newEmails) {
            const existingIds = new Set(allEmails.map(e => e.id));
            for (const em of newEmails) {
                if (!existingIds.has(em.id)) {
                    allEmails.push(em);
                }
            }
            allEmails.sort((a, b) => {
                const da = new Date(a.received_at);
                const db = new Date(b.received_at);
                return db - da;
            });
        }

        function renderEmailList() {
            const list = document.getElementById('emailList');
            const empty = document.getElementById('emptyState');

            if (allEmails.length === 0) {
                // Keep empty state
                list.innerHTML = '';
                list.appendChild(empty);
                empty.style.display = 'flex';
                return;
            }

            empty.style.display = 'none';
            list.innerHTML = '';
            allEmails.forEach((em, idx) => {
                const item = document.createElement('div');
                item.className = 'email-item';
                item.onclick = () => showDetail(idx);

                const avatar = document.createElement('div');
                avatar.className = 'email-avatar';
                avatar.textContent = (em.sender || '?')[0].toUpperCase();
                avatar.style.backgroundColor = stringToColor(em.sender || '');

                const content = document.createElement('div');
                content.className = 'email-item-content';

                const topRow = document.createElement('div');
                topRow.className = 'email-item-top';

                const sender = document.createElement('span');
                sender.className = 'email-sender';
                sender.textContent = em.sender || 'Unknown';

                const date = document.createElement('span');
                date.className = 'email-date';
                date.textContent = relativeTime(em.received_at);

                topRow.appendChild(sender);
                topRow.appendChild(date);

                const subject = document.createElement('div');
                subject.className = 'email-subject';
                subject.textContent = em.subject || '(No Subject)';

                const preview = document.createElement('div');
                preview.className = 'email-preview';
                preview.textContent = (em.body || '').substring(0, 100);

                content.appendChild(topRow);
                content.appendChild(subject);
                content.appendChild(preview);

                item.appendChild(avatar);
                item.appendChild(content);
                list.appendChild(item);
            });
        }

        function showDetail(idx) {
            const em = allEmails[idx];
            if (!em) return;

            // Highlight active item
            document.querySelectorAll('.email-item').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
            });

            const detail = document.getElementById('emailDetail');
            detail.innerHTML = `
                <div class="detail-header">
                    <h2 class="detail-subject">${escHtml(em.subject || '(No Subject)')}</h2>
                    <div class="detail-meta">
                        <div class="detail-avatar" style="background-color:${stringToColor(em.sender || '')}">${(em.sender || '?')[0].toUpperCase()}</div>
                        <div class="detail-meta-text">
                            <span class="detail-sender">${escHtml(em.sender || 'Unknown')}</span>
                            <span class="detail-date">${formatDate(em.received_at)}</span>
                        </div>
                    </div>
                </div>
                <div class="detail-body">${escHtml(em.body || '(Empty)')}</div>
            `;
        }

        function startScan() {
            if (scanTimer) return;

            const btn = document.getElementById('scanBtn');
            const btnText = document.getElementById('scanBtnText');
            btn.disabled = true;
            btn.classList.add('scanning');
            scanCountdown = 30;

            // Hide previous notification
            document.getElementById('scanNotification').classList.add('hidden');

            btnText.textContent = `Scanning... ${scanCountdown}s`;
            scanTimer = setInterval(() => {
                scanCountdown--;
                btnText.textContent = `Scanning... ${scanCountdown}s`;

                if (scanCountdown <= 0) {
                    clearInterval(scanTimer);
                    scanTimer = null;
                    btn.disabled = false;
                    btn.classList.remove('scanning');
                    btnText.textContent = 'Scan Email';

                    // Fetch new emails
                    doScan().then(() => {
                        // Show small notification
                        const notif = document.getElementById('scanNotification');
                        const notifText = document.getElementById('scanNotifText');
                        notifText.textContent = 'Scan complete. New emails have been loaded.';
                        notif.classList.remove('hidden');

                        setTimeout(() => {
                            notif.classList.add('hidden');
                        }, 10000);
                    });
                }
            }, 1000);
        }

        async function doScan() {
            const formData = new FormData();
            formData.append('token', currentToken);
            try {
                const resp = await fetch('/api/scan', { method: 'POST', body: formData });
                if (resp.ok) {
                    const data = await resp.json();
                    mergeEmails(data.emails);
                    renderEmailList();
                }
            } catch (e) {
                console.error('Scan error', e);
            }
        }

        function goBack() {
            document.getElementById('emailSection').classList.add('hidden');
            document.getElementById('tokenSection').classList.remove('hidden');
            document.getElementById('scanNotification').classList.add('hidden');
            allEmails = [];
            currentToken = '';
            if (scanTimer) {
                clearInterval(scanTimer);
                scanTimer = null;
            }
            document.getElementById('scanBtn').disabled = false;
            document.getElementById('scanBtn').classList.remove('scanning');
            document.getElementById('scanBtnText').textContent = 'Scan Email';
            document.getElementById('emailDetail').innerHTML = `
                <div class="detail-placeholder">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="64" height="64"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 4L12 13 2 4"/></svg>
                    <p>Select an email to read</p>
                </div>
            `;
            window.history.replaceState({}, '', '/');
        }

        function relativeTime(dt) {
            const now = new Date();
            const d = new Date(dt + 'Z');
            const diff = (now - d) / 1000;
            if (diff < 60) return 'now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            return d.toLocaleDateString();
        }

        function formatDate(dt) {
            const d = new Date(dt + 'Z');
            return d.toLocaleString();
        }

        function stringToColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const h = hash % 360;
            return `hsl(${h < 0 ? h + 360 : h}, 50%, 40%)`;
        }

        function escHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        // ─── Hidden Admin Login (click logo 5x) ─────────────────
        let logoClickCount = 0;
        let logoClickTimer = null;

        document.getElementById('logoIcon').addEventListener('click', function() {
            logoClickCount++;
            clearTimeout(logoClickTimer);
            logoClickTimer = setTimeout(() => { logoClickCount = 0; }, 2000);
            if (logoClickCount >= 5) {
                logoClickCount = 0;
                clearTimeout(logoClickTimer);
                openAdminModal();
            }
        });

        function openAdminModal() {
            document.getElementById('adminModal').classList.remove('hidden');
            document.getElementById('adminUser').focus();
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.add('hidden');
            document.getElementById('adminUser').value = '';
            document.getElementById('adminPass').value = '';
            document.getElementById('adminError').style.display = 'none';
        }

        async function handleAdminLogin(e) {
            e.preventDefault();
            const username = document.getElementById('adminUser').value;
            const password = document.getElementById('adminPass').value;
            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);
            try {
                const resp = await fetch('/gatekeeper', {
                    method: 'POST',
                    body: formData,
                    redirect: 'follow',
                });
                if (resp.redirected) {
                    window.location.href = resp.url;
                    return;
                }
                const errEl = document.getElementById('adminError');
                errEl.textContent = 'Invalid credentials';
                errEl.style.display = 'block';
            } catch (err) {
                const errEl = document.getElementById('adminError');
                errEl.textContent = 'Connection error';
                errEl.style.display = 'block';
            }
            return false;
        }
    </script>
</body>
</html>
